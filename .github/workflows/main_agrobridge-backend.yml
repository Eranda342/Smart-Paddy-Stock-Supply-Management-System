name: Build and deploy Node.js app to Azure Web App - agrobridge-backend

on:

  push:

    branches:

      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:

      contents: read

    steps:

      - uses: actions/checkout@v4

      - name: Set up Node.js

        uses: actions/setup-node@v3

        with:

          node-version: '20.x'

      - name: Install dependencies

        run: npm install

        working-directory: backend

      - name: Upload artifact

        uses: actions/upload-artifact@v4

        with:

          name: backend-app

          path: backend

  deploy:

    runs-on: ubuntu-latest

    needs: build

    permissions:

      id-token: write

      contents: read

    steps:

      - name: Download artifact

        uses: actions/download-artifact@v4

        with:

          name: backend-app

          path: backend

      - name: Azure Login

        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0C3321077FEB44CA9FD0BDA90C1223FE }}

          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E602E97C1CB74695A436CAE8B5ADACF9 }}

          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_356CFA514E6E49D48B28A6C933C42CBF }}

      - name: Deploy to Azure Web App

        uses: azure/webapps-deploy@v3

        with:

          app-name: 'agrobridge-backend'

          slot-name: 'Production'

          package: backend
